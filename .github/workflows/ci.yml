name: CI - core-moteur

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-core-moteur-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore engine dependencies
        run: dotnet restore lib/AstreaEngine.csproj

      - name: Build engine
        run: dotnet build lib/AstreaEngine.csproj -c Release --no-restore

      - name: Start GraphHopper (Nantes test map)
        run: |
          docker compose -f docker-compose.test.yml up -d --build
          echo "Waiting for GraphHopper to be ready..."
          timeout=60
          while [ $timeout -gt 0 ]; do
            if curl -s http://localhost:8989/health | grep -q 'OK'; then
              echo "GraphHopper is ready!"
              break
            fi
            sleep 1
            timeout=$((timeout - 1))
          done

          if [ $timeout -eq 0 ]; then
            echo "Error: GraphHopper failed to start within 60s"
            docker compose -f docker-compose.test.yml logs graphhopper
            exit 1
          fi

      - name: Run tests
        run: dotnet test tests --configuration Release
