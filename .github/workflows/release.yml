name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - run: dotnet restore lib/AstreaEngine.csproj

      - run: dotnet build lib/AstreaEngine.csproj --configuration Release --no-restore

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            lib/bin/Release/net8.0/AstreaEngine.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}